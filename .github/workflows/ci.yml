name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build library and encyclopedia
        uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
          build-args: "AnalyticNumberTheory Encyclopedia"

      - name: Verify zero sorry, admit, and custom axioms
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          def strip_lean_comments(src: str) -> str:
              out = []
              i, n = 0, len(src)
              block_depth = 0
              in_string = False
              while i < n:
                  if in_string:
                      if src[i] == "\\" and i + 1 < n:
                          out.append("  ")
                          i += 2
                          continue
                      if src[i] == '"':
                          in_string = False
                      out.append("\n" if src[i] == "\n" else " ")
                      i += 1
                  elif block_depth > 0:
                      if src[i:i+2] == "/-":
                          block_depth += 1
                          out.append("  ")
                          i += 2
                      elif src[i:i+2] == "-/":
                          block_depth -= 1
                          out.append("  ")
                          i += 2
                      else:
                          out.append("\n" if src[i] == "\n" else " ")
                          i += 1
                  elif src[i:i+2] == "/-":
                      block_depth = 1
                      out.append("  ")
                      i += 2
                  elif src[i:i+2] == "--":
                      while i < n and src[i] != "\n":
                          out.append(" ")
                          i += 1
                  elif src[i] == '"':
                      in_string = True
                      out.append(" ")
                      i += 1
                  else:
                      out.append(src[i])
                      i += 1
              return "".join(out)

          errors = []
          for root in ["AnalyticNumberTheory", "Encyclopedia", "AnalyticNumberTheory.lean", "Encyclopedia.lean"]:
              p = pathlib.Path(root)
              files = [p] if p.is_file() else sorted(p.rglob("*.lean"))
              for f in files:
                  cleaned = strip_lean_comments(f.read_text(encoding="utf-8"))
                  for lineno, line in enumerate(cleaned.splitlines(), 1):
                      if re.search(r"\bsorry\b|\badmit\b", line):
                          errors.append(f"{f}:{lineno}: found sorry/admit")
                      if re.match(r"^\s*axiom\s+", line):
                          errors.append(f"{f}:{lineno}: found custom axiom")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("All Lean files are free of sorry, admit, and custom axioms.")
          EOF
