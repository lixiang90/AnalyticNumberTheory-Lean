name: Deploy Encyclopedia to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lean library and Encyclopedia
        uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"
          build-args: "AnalyticNumberTheory Encyclopedia"

      - name: Render Verso HTML Encyclopedia
        run: lake run verso/versoMain EncyclopediaMain.lean

      - name: Verify generated HTML
        run: |
          for page in index.html waring/index.html sieve-methods/index.html index-terms/index.html; do
            test -s "_out/html-multi/$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _out/html-multi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
